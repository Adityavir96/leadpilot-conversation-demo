
name: Deploy LeadPilot Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: leadpilot-enhanced/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: leadpilot-enhanced

      - name: Build app
        run: npm run build
        working-directory: leadpilot-enhanced

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload build
        uses: actions/upload-pages-artifact@v3
        with:
          path: leadpilot-enhanced/dist

      - name: Deploy
        uses: actions/deploy-pages@v4
